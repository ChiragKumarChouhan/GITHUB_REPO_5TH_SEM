<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg- flex items-center justify-center min-h-screen">

    <form class="bg-gray-900 p-8 rounded-xl shadow-lg w-96 border border-yellow-400">

        <h1 class="text-3xl font-bold text-white text-center mb-6">
            Login
        </h1>

        <div class="mb-4">
            <label for="name" class="block text-white mb-2">
                Username
            </label>
            <input id="name" type="text" placeholder="Enter your username"
                class="w-full px-4 py-2 rounded-lg border border-gray-600 bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
        </div>

        <div class="mb-6">
            <label for="password" class="block text-white mb-2">
                Password
            </label>
            <input id="password" type="password" placeholder="Enter your password"
                class="w-full px-4 py-2 rounded-lg border border-gray-600 bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
        </div>

        <button type="submit"
            class="w-full bg-yellow-400 text-black font-semibold py-2 rounded-lg hover:bg-yellow-500 transition">
            Login
        </button>

    </form>

</body>

</html>
