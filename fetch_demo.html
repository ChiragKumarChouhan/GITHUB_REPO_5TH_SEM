<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo fetch</title>

    <style>
        table {
            width: 80vw;
            border-collapse: collapse;
            margin: auto;
            text-align: center;
        }

        th,
        td {
            border: 2px solid red;
            padding: 8px;
        }

        img {
            width: 80px;
            height: 80px;
            object-fit: contain;

        }
    </style>

    <script>
        const URL = "https://dummyjson.com/products?limit=10&skip=3";

        async function loadProduct() {
            try {
                const res = await fetch(URL);
                console.log("res =", res);

                const data = await res.json();
                console.log("data =", data.products);

                let rows = "";

                data.products.map((i, index) => {
                    rows += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${i.title}</td>

                            <td>
                                <img src="${i.thumbnail}" alt="${i.title}">
                            </td>

                            <td>${i.category}</td>
                            <td>${i.rating}</td>
                            <td>${i.price}</td>
                            <td>${i.stock}</td>
                        </tr>
                    `;
                });

                const el = document.getElementById("data");
                el.innerHTML = rows;

            } catch (err) {
                console.log("ERROR =", err);
            }
        }

        loadProduct();
    </script>
</head>

<body>

    <h1>
        <center>List of Products</center>
    </h1>

    <table>
        <thead>
            <tr>
                <th>Sr.No</th>
                <th>Title</th>
                <th>Image</th>
                <th>Category</th>
                <th>Rating</th>
                <th>Price</th>
                <th>Stocks</th>
            </tr>
        </thead>

        <tbody id="data">
        </tbody>
    </table>

</body>

</html>
