<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        #bookstore {
            display: flex;
            gap: 20px;
            text-align: center;
            justify-content: center;
            padding-top: 15%;
        }

        .book {
            width: 200px;
            padding: 15px;
            border: 1px solid #ccc;
            text-align: center;
        }

        .book img {
            object-fit: cover;
        }

        .book button {
            padding: 8px 15px;
            cursor: pointer;

        }
    </style>



</head>

<body>

    <h1 style="text-align: center;">Book Store</h1>

    <div id="bookstore"></div>


</body>
<script src="bookstore.js"></script>

</html>
