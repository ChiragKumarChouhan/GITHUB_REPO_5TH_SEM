<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Entry Form</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 600px;
        }

        fieldset {
            padding: 25px;
            border: 2px solid black;
            border-radius: 10px;
            background: white;
        }

        legend {
            font-size: 35px;
            font-weight: bold;
            text-align: left;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: inline-block;
            width: 140px;
            font-size: 18px;
        }

        input,
        textarea,
        select {
            padding: 8px;
            width: 300px;
            font-size: 16px;
        }

        .gender label,
        .hobby label {
            width: auto;
            margin-right: 15px;
        }

        .gender input,
        .hobby input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            background: royalblue;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }
    </style>
</head>

<body>

    <div class="container">

        <form>

            <fieldset>

                <legend>Student Entry Form</legend>

                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" placeholder="Enter your ID">
                </div>

                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" placeholder="Enter your Name">
                </div>

                <div class="form-group">
                    <label for="fatherName">Father's Name</label>
                    <input type="text" id="fatherName" placeholder="Enter Father's Name">
                </div>

                <div class="form-group">
                    <label for="motherName">Mother's Name</label>
                    <input type="text" id="motherName" placeholder="Enter Mother's Name">
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob">
                </div>

                <div class="form-group gender">
                    <label>Gender</label>

                    <input type="radio" id="male" name="gender">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender">
                    <label for="female">Female</label>

                    <input type="radio" id="otherGender" name="gender">
                    <label for="otherGender">Other</label>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="Mobile Number">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter Password">
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" rows="4" placeholder="Enter your full address"></textarea>
                </div>

                <div class="form-group">
                    <label for="year">Year</label>
                    <select id="year">
                        <option>1st</option>
                        <option>2nd</option>
                        <option>3rd</option>
                        <option>4th</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department">
                        <option>CSE</option>
                        <option>CSE-DS</option>
                        <option>CSE-AIML</option>
                        <option>Mechanical</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="semester">Semester</label>
                    <select id="semester">
                        <option>1st</option>
                        <option>2nd</option>
                        <option>3rd</option>
                        <option>4th</option>
                    </select>
                </div>

                <div class="form-group hobby">
                    <label>Hobbies</label>

                    <input type="checkbox" id="reading">
                    <label for="reading">Reading</label>

                    <input type="checkbox" id="sports">
                    <label for="sports">Sports</label>

                    <input type="checkbox" id="music">
                    <label for="music">Music</label>
                </div>

                <div class="form-group">
                    <label for="photo">Upload Photo</label>
                    <input type="file" id="photo" accept="image/*">
                </div>

                <button type="submit">Submit</button>

            </fieldset>

        </form>

    </div>

</body>

</html>
